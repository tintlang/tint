[package]
name = "rune-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rune-lexer = { path = "../rune-lexer" }
rune-ast = { path = "../rune-ast" }
rune-parser = { path = "../rune-parser" }
rune-runtime = { path = "../rune-runtime" }
rune-evaluator = { path = "../rune-evaluator" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
