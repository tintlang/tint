[package]
name = "tint"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embed Tint in Rust: load .tn files, call their functions, and export Rust functions to them."

[features]
default = ["host"]
# Loading and running Tint programs (`Tint`, `UiSession`). Off for a crate that
# only exports functions into the browser: it then pulls in no interpreter.
host = ["dep:tint-runtime", "dep:tint-parser", "dep:tint-lexer"]

[dependencies]
tint-ast = { path = "../tint-ast" }
tint-evaluator = { path = "../tint-evaluator" }
tint-macros = { path = "../tint-macros" }
tint-lexer = { path = "../tint-lexer", optional = true }
tint-parser = { path = "../tint-parser", optional = true }
tint-runtime = { path = "../tint-runtime", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
inventory = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
