[package]
name = "tint-wasmgen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly backend for the Tint typed IR"

[dependencies]
tint-ir = { path = "../tint-ir" }
tint-wasmabi = { path = "../tint-wasmabi" }
wasm-encoder = "0.245"

[dev-dependencies]
tint-runtime = { path = "../tint-runtime", default-features = false, features = ["typed-ir", "bytecode"] }
serde_json = "1.0"
tint-compiler = { path = "../tint-compiler" }
tint-ast = { path = "../tint-ast" }
wasmi = { version = "2", features = ["portable-dispatch"] }
tint-lexer = { path = "../tint-lexer" }
tint-parser = { path = "../tint-parser" }
tint-semantics = { path = "../tint-semantics" }
