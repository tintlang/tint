[package]
name = "tint-wasmrt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime of Tint programs compiled to WebAssembly: heap, strings, lists, maps"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tint-ir = { path = "../tint-ir" }
tint-wasmabi = { path = "../tint-wasmabi" }
serde_json = "1.0"
tint-runtime = { path = "../tint-runtime", default-features = false, features = ["typed-ir"], optional = true }

wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["console"], optional = true }
js-sys = { version = "0.3", optional = true }

[features]
# Built-in host functions for the tests (`shout`, `sum_all`, `wait`, ...).
test-natives = []
# Linked into the page's own wasm-bindgen module: the host services are
# provided in Rust instead of the `env` imports of a standalone runtime module.
dom = ["ui", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
# The UI runtime: elements a `ui fn` emits become render trees.
ui = ["dep:tint-runtime"]
