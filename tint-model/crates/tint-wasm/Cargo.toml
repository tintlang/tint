[package]
name = "tint-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["interpreter", "bytecode", "sandbox-api"]
# check/run/REPL/tree-as-data entry points for the sandbox. The standalone page
# is built without them.
sandbox-api = ["interpreter"]
# The tree-walking interpreter: `new DomSession(source, ..)`, `Preview`, the sandbox. A page
# of an app compiled to WebAssembly that needs none of it is built without (`compiled` only).
interpreter = []
# Drives apps compiled to WebAssembly (`tint build`): the runtime of `tint-wasmrt` is
# linked into this module.
compiled = ["dep:tint-wasmrt", "dep:tint-ir"]
# `compile_bytecode` / `from_bytecode`. The standalone page embeds a runtime built
# with --no-default-features (see sandbox/build-wasm.sh): ~25% smaller.
bytecode = ["interpreter", "sandbox-api", "tint-runtime/bytecode", "tint-runtime/semantic-check", "dep:tint-semantics"]

[dependencies]
tint-wasmrt = { path = "../tint-wasmrt", features = ["dom"], optional = true }
tint-ir = { path = "../tint-ir", optional = true }
tint-lexer = { path = "../tint-lexer" }
tint-ast = { path = "../tint-ast" }
tint-parser = { path = "../tint-parser" }
tint-runtime = { path = "../tint-runtime", default-features = false }
tint-evaluator = { path = "../tint-evaluator" }
tint-semantics = { path = "../tint-semantics", optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
web-sys = { version = "0.3", features = [
    "Performance",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "CssStyleDeclaration",
    "DocumentFragment",
    "HtmlTemplateElement",
    "Node",
    "Location",
    "History",
    "MouseEvent",
    "PointerEvent",
    "NodeList",
    "EventTarget",
    "Event",
    "KeyboardEvent",
    "HtmlAudioElement",
    "HtmlTextAreaElement",
    "Storage",
    "console",
] }

# wasm-pack's own wasm-opt post-processing step needs a specific binaryen
# release (117 as of this writing) that matches the wasm-bindgen version
# above; when that exact binary can't be downloaded (blocked network,
# offline build) wasm-pack falls back to whatever `wasm-opt` is on PATH,
# which can be a much older binaryen build (e.g. a Linux distro package)
# that doesn't understand the newer reference-types/externref encoding
# wasm-bindgen 0.2.129 emits. That combination doesn't error at build
# time -- it silently produces a corrupted .wasm that crashes at runtime
# with "WebAssembly.Table.grow(): failed to grow table by N" the moment
# the JS glue tries to set up the externref table. Disabling wasm-opt
# here avoids that trap entirely; the cost is a somewhat larger .wasm
# (no dead-code/size optimization pass), which is a fine trade for a
# build that actually runs.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
