[package]
name = "tint-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tint-lexer = { path = "../tint-lexer" }
tint-ast = { path = "../tint-ast" }
tint-parser = { path = "../tint-parser" }
tint-runtime = { path = "../tint-runtime" }
tint-evaluator = { path = "../tint-evaluator" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
