<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DomSession visual test</title>
  <style>
    body { font-family: sans-serif; background: #0b0c10; color: #eee; padding: 24px; }
    #root { display: inline-block; }
  </style>
</head>
<body>
  <h1>DomSession direct-DOM test &mdash; examples/ui_app.tn</h1>
  <p>No Svelte anywhere on this page, and no hand-written source below &mdash;
     this loads the actual <code>examples/ui_app.tn</code> file straight off disk
     and renders it through <code>DomSession</code> (Rust/web-sys, no JS framework).</p>
  <div id="root"></div>
  <p id="status">Loading...</p>

  <script src="./dom-test-pkg/tint_wasm.js"></script>
  <script>
    const status = document.getElementById("status");

    async function main() {
      const [source] = await Promise.all([
        fetch("./examples/ui_app.tn").then((r) => {
          if (!r.ok) throw new Error("could not fetch examples/ui_app.tn: " + r.status);
          return r.text();
        }),
        wasm_bindgen("./dom-test-pkg/tint_wasm_bg.wasm"),
      ]);

      const { DomSession } = wasm_bindgen;
      const session = new DomSession(source, "App", "root");
      const err = session.rerender();
      status.textContent = err ? ("Error: " + err) : "Rendered ui_app.tn via DomSession.";
    }

    main().catch((e) => {
      status.textContent = "Failed: " + e;
      console.error(e);
    });
  </script>
</body>
</html>
