[workspace]
members = [
    "crates/tint-lexer",
    "crates/tint-ast",
    "crates/tint-ir",
    "crates/tint-codegen",
    "crates/tint-wasmgen",
    "crates/tint-wasmabi",
    "crates/tint-wasmrt",
    "crates/tint-parser",
    "crates/tint-runtime",
    "crates/tint-semantics",
    "crates/tint-evaluator",
    "crates/tint-wasm",
    "crates/tint-cli",
    "crates/tint",
    "crates/tint-macros",
    "crates/tint-compiler",
    "crates/tint-analyzer",
]

resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"

# Browser runtime only (see sandbox/build-wasm.sh). "s" instead of "z": about 10-15%
# faster rendering for roughly +20% wasm size (measured in bench/ui).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Runtime of apps compiled to WebAssembly (`tint build`): size over speed, the DOM layer
# is the only hot code in it (scripts/build-cli-runtimes.sh).
[profile.wasm-small]
inherits = "wasm"
opt-level = "z"
