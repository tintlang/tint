[workspace]
members = [
    "crates/tint-lexer",
    "crates/tint-ast",
    "crates/tint-ir",
    "crates/tint-codegen",
    "crates/tint-parser",
    "crates/tint-runtime",
    "crates/tint-semantics",
    "crates/tint-evaluator",
    "crates/tint-wasm",
    "crates/tint-cli",
    "crates/tint-compiler",
    "crates/tint-analyzer",
]

resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"

# Browser runtime only (see sandbox/build-wasm.sh). "s" instead of "z": about 10-15%
# faster rendering for roughly +20% wasm size (measured in bench/ui).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
